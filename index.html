<title>Sumi Slash</title>
<style>/* One screen of washi. The canvas is the page; menus sit on it like brushed labels. */
:root{
  --paper:#d8dbc4;--ink:#17160f;--seal:#c62f1c;--bone:#f2e5c9;--wash:#6c7060;--ui:#17160f;
  --display:"Hiragino Mincho ProN",YuMincho,serif;
  --body:"Hiragino Sans",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  color-scheme:light;background:var(--paper);
  padding-top:0;padding-bottom:0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}

/* title */
#title{justify-content:flex-end;pointer-events:none}
#title>*{pointer-events:auto}
#title h1{font:400 clamp(44px,14vw,66px)/1 var(--display);letter-spacing:.04em;margin:0;text-wrap:balance}
#title .tag{margin:6px 0 16px;font-size:15px;font-weight:600;color:var(--ink)}
.acts{display:flex;flex-direction:column;gap:8px;max-width:420px;padding-bottom:10px}
.act{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:50px;padding:10px 14px;text-align:left;font:400 21px/1.2 var(--display);border-bottom:2px solid var(--ink);transition:transform .12s}
.act small{font:600 14px/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.act.main{background:var(--ink);color:var(--paper);border-bottom:0}
.act:active{transform:translateX(5px)}
.row{display:flex;gap:18px;align-items:center;font-size:14px;font-weight:600}
.row button{min-height:40px;text-decoration:underline;text-underline-offset:3px}

/* the scroll */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;flex:none}
.head h2{font:400 26px/1 var(--display);margin:0}
.back{min-width:46px;min-height:44px;display:flex;align-items:center}
.koku{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.koku i{font:400 16px/1 var(--display);font-style:normal;color:var(--seal);margin-left:4px}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:26px}
.chap{padding-block:14px 8px}
.chap header{display:flex;align-items:baseline;gap:10px;padding-bottom:9px}
.chap h3{font:400 21px/1.15 var(--display);margin:0;flex:1;min-width:0}
.chap .jp{font:400 15px/1 var(--display);color:var(--seal)}
.chap .cnt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{position:relative;aspect-ratio:1;max-width:100%;background:rgba(23,22,15,.075);display:flex;align-items:flex-start;justify-content:flex-start;padding:5px 6px;font:400 17px/1 var(--display);overflow:hidden}
.tile:not(:disabled):active{transform:scale(.95)}
.tile svg,.tile img{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile.painted{background:none}
.tile.painted .pips b{box-shadow:0 0 0 1px rgba(242,229,201,.75)}
.tile.painted .pips b:not(.on){background:rgba(128,124,112,.55)}
.tile .n{position:relative}
.tile .pips{position:absolute;right:5px;bottom:5px;display:flex;gap:2px}
.tile .pips b{width:7px;height:7px;background:rgba(23,22,15,.2)}
.tile .pips b.on{background:var(--seal)}
.tile.boss{background:var(--ink);color:var(--paper)}
.tile.boss .pips b{background:rgba(216,219,196,.28)}
.tile.boss .pips b.on{background:var(--seal)}
.tile:disabled{opacity:.34;cursor:default}
.tile.next{box-shadow:inset 0 0 0 2px var(--seal)}

/* armoury */
#pv{flex:none;width:100%;height:150px;display:block}
.tabs{display:flex;gap:20px;flex:none;padding-block:10px 8px}
.tabs button{font:400 19px/1.2 var(--display);min-height:36px;opacity:.5;border-bottom:3px solid transparent}
.tabs button.on{opacity:1;border-color:var(--seal)}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.item{display:flex;flex-direction:column;gap:5px;min-height:62px;padding:9px 10px;text-align:left;background:rgba(23,22,15,.075)}
.item b{font:400 17px/1.15 var(--display)}
.item span{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.item.eq{background:var(--ink);color:var(--paper)}
.item.poor span{color:var(--seal)}
.swatch{display:inline-block;width:20px;height:6px;margin-right:6px;vertical-align:middle}

/* in-play labels */
#hud{position:absolute;top:0;left:0;right:0;min-height:64px;height:auto;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding-top:max(4px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--ui);pointer-events:none}
#hud button{pointer-events:auto;width:44px;height:44px;margin-inline:-10px;display:flex;align-items:center;justify-content:center}
#hud svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#hudT{flex:1;min-width:0;text-align:center;padding-top:7px;font:400 17px/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudPlate{display:inline-block;background:var(--paper-now,var(--paper));padding:2px 10px}
#hudN{font-family:var(--body);font-weight:700;font-size:14px;margin-right:7px;font-variant-numeric:tabular-nums}
#hint{position:absolute;left:0;right:0;bottom:max(7px,env(safe-area-inset-bottom,0px));margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center;font-size:14px;line-height:1.25;font-weight:700;color:var(--ui);pointer-events:none;text-wrap:balance}
#hint.warn{color:var(--bone);text-shadow:none}
#hint.warn span{background:#7f1a0d;padding:3px 8px}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;color:var(--ui);pointer-events:none;opacity:0;padding-inline:16px}
#banner.on{animation:bn 1.25s ease-out both}
#banner small{display:block;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding-bottom:6px}
#banner b{font:400 clamp(34px,10vw,50px)/1.08 var(--display);text-wrap:balance}
@keyframes bn{0%{opacity:0;transform:translateX(-14px)}14%{opacity:1;transform:none}72%{opacity:1}100%{opacity:0;transform:translateX(10px)}}

/* cards */
.card{position:absolute;left:0;right:0;bottom:0;padding-top:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--bone);animation:up .22s ease-out both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.card h3{font:400 25px/1.15 var(--display);margin:0;text-wrap:balance}
.card p{margin:5px 0 0;font-size:15px;line-height:1.3}
.card .btns{display:flex;gap:8px;padding-top:12px}
.card .btns button{flex:1;min-height:50px;font:400 19px/1 var(--display);background:rgba(242,229,201,.14)}
.card .btns button.go{flex:2;background:var(--seal);color:#fff5e4}
#seals{display:flex;gap:12px;padding-top:12px}
.seal{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;line-height:1.1;opacity:.45}
.seal i{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:2px solid currentColor;font:400 17px/1 var(--display);font-style:normal}
.seal.on{opacity:1}
.seal.on i{background:var(--seal);border-color:var(--seal);color:#fff5e4;animation:stamp .26s cubic-bezier(.2,1.6,.4,1) both}
.seal:nth-child(2) i{animation-delay:.16s}.seal:nth-child(3) i{animation-delay:.32s}
@keyframes stamp{from{transform:scale(2.4) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
#foe{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(10,9,6,.5)}
#foeC{align-self:center;display:block;width:min(72vw,300px);height:auto;max-height:46vh;flex:0 1 auto;margin-bottom:-1px}
#foe .card{position:relative;flex:none;left:auto;right:auto;width:100%;transform:none}
.card .jp{float:right;font:400 26px/1 var(--display);color:var(--seal);padding-left:10px}
#dead{cursor:pointer}
#safeProbe{position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;pointer-events:none;visibility:hidden}
#satProbe,#sabProbe{display:block;width:0}
#satProbe{height:env(safe-area-inset-top,0px)}
#sabProbe{height:env(safe-area-inset-bottom,0px)}
#res,#dead{bottom:env(safe-area-inset-bottom,0px);padding-bottom:16px;max-height:calc(100dvh - env(safe-area-inset-bottom,0px));animation:none;box-sizing:border-box;overflow:auto}

@media (min-width:640px){#res,#dead{left:50%;right:auto;width:440px;transform:translateX(-50%);animation:none}#foe .card{align-self:center;width:440px}.acts{max-width:360px}.grid{grid-template-columns:repeat(5,minmax(0,92px))}.items{grid-template-columns:repeat(4,minmax(0,1fr))}}
#turn{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:auto}
#turn p{margin:0;max-width:22em;padding:18px 22px;font:400 clamp(26px,6vw,36px)/1.2 var(--display);text-align:center;border:2px solid var(--ink);background:var(--paper)}
@media (orientation:landscape){#turn{display:flex}}

  <div id="banner"></div>

  <section id="map" class="screen" hidden>

    <div class="scroll" id="mapL"></div>

  <section id="arm" class="screen" hidden>
    <div class="head"><button class="back" id="armBack" aria-label="Back"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button><h2>Armoury</h2><span class="koku" id="armK"></span></div>

  </section>

  <div id="foe" hidden>
    <canvas id="foeC" width="580" height="500"></canvas>

  </div>

  <div class="card" id="dead" hidden><h3 id="deadH"></h3><p id="deadP"></p><div class="btns" id="deadB"></div></div>

  <div class="card" id="res" hidden>
    <h3 id="resH"></h3><p id="resP"></p>
    <div id="seals"></div>
    <div class="btns"><button id="resAgain">Redraw</button><button class="go" id="resNext">Next page</button></div>
  </div>
</div>

function makePaper(w,h,th,seed){
  const c=mk(w,h),g=c.getContext('2d'),r=mulberry(seed||9);
  g.fillStyle=th.paper;g.fillRect(0,0,w,h);
  const big=Math.max(w,h);
  for(let i=0;i<26;i++){
    const x=r()*w,y=r()*h,q=big*(.08+r()*.26),gr=g.createRadialGradient(x,y,0,x,y,q);
    gr.addColorStop(0,th.shade);gr.addColorStop(1,th.shade+'00');

  g.lineCap='round';
  for(let i=0;i<big*.8;i++){
    const x=r()*w,y=r()*h,a=r()*6.28,l=(12+r()*60)*(big/900);
    g.globalAlpha=.05+r()*.11;g.strokeStyle=r()>.5?th.shade:(th.dark?'#ffffff':'#fbf8ea');
    g.lineWidth=.5+r()*1;g.beginPath();g.moveTo(x,y);

  }
  g.fillStyle=th.dark?'#000':th.shade;
  for(let i=0;i<big*1.5;i++){g.globalAlpha=.06+r()*.14;g.fillRect(r()*w,r()*h,1+r()*1.6,1+r()*1.6)}
  g.globalAlpha=1;
  const v=g.createRadialGradient(w/2,h/2,big*.3,w/2,h/2,big*.75);
  v.addColorStop(0,th.shade+'00');v.addColorStop(1,th.dark?'#00000088':th.shade+'cc');
  g.fillStyle=v;g.fillRect(0,0,w,h);

}
function inkBarY(){
  readInsets();
  const el=$('hudT');
  let y=INSETS.t+38;
  if(el){
    const r=el.getBoundingClientRect();
    if(r.height>0)y=r.bottom+8;
  }

}
function drawInk(){
  const g=ctx,w=Math.min(VW-112,300),x=(VW-w)/2,y=inkBarY(),left=clamp(1-P.used/P.ink,0,1);
  const par=clamp(1-P.par/P.ink,0,1);
  g.setTransform(DPR,0,0,DPR,0,0);
  g.globalAlpha=.2;g.fillStyle=TH.ui;g.fillRect(x,y+3,w,5);g.globalAlpha=1;
  g.save();g.beginPath();g.rect(x,y-2,w*left,16);g.clip();g.drawImage(inkBar,x,y-2,w,14);g.restore();
  /* the thrift seal holds while the bar stays right of this mark */
  g.fillStyle=TH.key==='d'?TH.paper:TH.red;g.fillRect(x+w*par-1.5,y-3,3,16);
  g.setTransform(1,0,0,1,0,0);
}

let titleArt=null,titleT=0,titleDone=false;
function bakeTitleArt(){
  const w=cv.width,h=cv.height,art=mk(w,h),g=art.getContext('2d'),r=mulberry(21);
  const areaH=Math.max(170,(VH-335))*DPR,size=Math.min(VW*.5*DPR,areaH*.47),cx=w*.62,top=Math.max(14*DPR,(areaH-size*2)*.45);
  g.fillStyle=THEMES[0].ink;g.textAlign='center';g.textBaseline='middle';g.font='400 '+size+'px "Hiragino Mincho ProN",YuMincho,serif';
  g.fillText('墨',cx,top+size*.52);g.fillText('斬',cx,top+size*1.52);
  g.globalCompositeOperation='destination-out';g.globalAlpha=.75;g.drawImage(speckle(),0,0,w,h);g.globalCompositeOperation='source-over';g.globalAlpha=1;
  const ax=w*.1,ay=top+size*2.1,bx=w*.97,by=top+size*.1;
  titleArt={art,ax,ay,bx,by,size,top,cx};
  const halves=[1,-1].map(sd=>{
    const c=mk(w,h),q=c.getContext('2d'),dx=bx-ax,dy=by-ay,l=hyp(dx,dy),ux=dx/l,uy=dy/l,nx=-uy*sd,ny=ux*sd,L=Math.max(w,h)*2;
    q.beginPath();q.moveTo(ax-ux*L,ay-uy*L);q.lineTo(ax+ux*L,ay+uy*L);q.lineTo(ax+ux*L+nx*L,ay+uy*L+ny*L);q.lineTo(ax-ux*L+nx*L,ay-uy*L+ny*L);q.closePath();q.clip();q.drawImage(art,0,0);
    return{c,ux,uy,sd};
  });
  titleArt.h=halves;
  const st=mk(w,h),q=st.getContext('2d');q.scale(1,1);
  brushOn(q,[[ax,ay,.5],[lerp(ax,bx,.45),lerp(ay,by,.5),1],[bx,by,.4]],15*DPR,{c:THEMES[0].red,dry:.5,tin:.05,tout:.25,rnd:r});
  for(let i=0;i<46;i++){const t=r(),d=(r()-.5)*90*DPR;const x=lerp(ax,bx,t)+d*.5,y=lerp(ay,by,t)+d;q.fillStyle=THEMES[0].red;q.globalAlpha=.9;q.beginPath();q.arc(x,y,(.5+r()*3.4)*DPR,0,6.283);q.fill()}
  q.globalAlpha=1;titleArt.stroke=st;
}
function drawTitle(dt){
  const g=ctx;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;
  g.drawImage(paperFor(THEMES[0]),0,0);
  if(mode!=='title')return;
  if(!titleArt)bakeTitleArt();
  titleT+=dt;
  const a=titleArt,t=REDUCE?2:titleT;
  const prog=clamp((t-.45)/.2,0,1),split=clamp((t-1.05)/.35,0,1),e=1-Math.pow(1-split,3);
  if(split<=0)g.drawImage(a.art,0,0);
  else a.h.forEach(h=>{const o=e*7*DPR*h.sd;g.drawImage(h.c,h.ux*o+(-h.uy)*e*2*DPR*h.sd,h.uy*o+h.ux*e*2*DPR*h.sd)});
  if(prog>0){g.save();g.beginPath();g.rect(0,a.by-60*DPR-0,lerp(a.ax,a.bx,prog)+60*DPR,cv.height);g.clip();g.drawImage(a.stroke,0,0);g.restore()}
  const sp=samuraiSprite('cut',SV.eq.war,palOf(THEMES[0])),q=Math.min(1,VW/420)*(VH<640?.72:1);
  g.setTransform(DPR,0,0,DPR,0,0);
  const fx=VW*.34,fy=Math.max(146,VH-336);
  g.globalAlpha=.18;g.fillStyle=THEMES[0].ink;g.beginPath();g.ellipse(fx,fy+2,84*q,10*q,0,0,6.283);g.fill();g.globalAlpha=1;
  drawSprite(g,sp,fx,fy,q);
  g.setTransform(1,0,0,1,0,0);
}
function refreshTitle(){
  const any=Object.keys(SV.lv).length;
  $('playL').textContent=any?'Continue':'Begin';
  const n=Object.values(SV.lv).reduce((a,r)=>a+(r.s||[]).filter(Boolean).length,0);

function showTitle(){mode='title';$('title').hidden=false;$('map').hidden=true;$('arm').hidden=true;refreshTitle()}
function showMap(){mode='map';['title','arm'].forEach(i=>$(i).hidden=true);$('map').hidden=false;renderMap()}
function kokuTag(el){el.textContent=String(SV.koku);const i=document.createElement('i');i.textContent='石';el.append(i)}
/* each cleared page becomes a small ink painting of the stroke that cleared it:
   chapter washi, the saved path through the brush engine, a few blots. Rebuilt from the
   saved simplified path (k) and a seed (g); older saves without g use the page id. */
const TILE_PX=256,tileCache={};
let tileBake={gen:0,idle:null,via:''};
function cancelTileBake(){
  tileBake.gen++;
  if(tileBake.idle!=null){
    if(tileBake.via==='idle'&&typeof cancelIdleCallback==='function')cancelIdleCallback(tileBake.idle);
    else clearTimeout(tileBake.idle);
    tileBake.idle=null;
  }
}
function tileKey(id,rec,th){
  const seed=rec.g==null?id*7919+17:rec.g;
  return id+'|'+seed+'|'+th.key+'|'+rec.k.join(',');
}
function scheduleTileBake(gen,jobs){
  const start=()=>{
    if(gen!==tileBake.gen)return;
    const sc=$('mapL'),vr=sc.getBoundingClientRect();
    jobs.sort((a,b)=>{
      const ra=a.b.getBoundingClientRect(),rb=b.b.getBoundingClientRect();
      const va=ra.bottom>vr.top&&ra.top<vr.bottom;
      const vb=rb.bottom>vr.top&&rb.top<vr.bottom;
      if(va!==vb)return va?-1:1;
      return ra.top-rb.top;
    });
    const pump=()=>{
      if(gen!==tileBake.gen)return;
      const until=performance.now()+8;
      while(jobs.length&&performance.now()<until){
        const j=jobs.shift();
        if(!j.im.isConnected)continue;
        j.im.src=tilePainting(j.id,j.rec,j.th,j.boss);
        j.b.classList.add('painted');
        j.b.style.color=j.th.ink;
        j.b.style.background='';
      }
      if(!jobs.length){tileBake.idle=null;return}
      if(typeof requestIdleCallback==='function'){
        tileBake.via='idle';
        tileBake.idle=requestIdleCallback(()=>pump(),{timeout:48});
      }else{
        tileBake.via='to';
        tileBake.idle=setTimeout(pump,0);
      }
    };
    pump();
  };
  if(typeof requestIdleCallback==='function'){
    tileBake.via='idle';
    tileBake.idle=requestIdleCallback(start,{timeout:32});
  }else{
    tileBake.via='to';
    tileBake.idle=setTimeout(start,0);
  }
}
function tilePainting(id,rec,th,boss){
  const seed=rec.g==null?id*7919+17:rec.g,key=tileKey(id,rec,th);
  if(tileCache[key])return tileCache[key];
  const S=TILE_PX,c=makePaper(S,S,th,(seed%997)+3),g=c.getContext('2d'),R=mulberry(seed),k=rec.k;
  /* a soft ground wash */
  g.globalAlpha=.32;brushOn(g,[[-10,S*.78,.6],[S*.5,S*(.72+R()*.08),1],[S+10,S*.8,.5]],S*.16,{c:th.shade,dry:.6,tin:.02,tout:.05,rnd:R});g.globalAlpha=1;
  /* fit the stroke's bounds into the square */
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=0;i<k.length;i+=2){x0=Math.min(x0,k[i]);x1=Math.max(x1,k[i]);y0=Math.min(y0,k[i+1]);y1=Math.max(y1,k[i+1])}
  const span=Math.max(x1-x0,y1-y0,160),q=S*.78/span,cx=(x0+x1)/2,cy=(y0+y1)/2;
  const pts=[];for(let i=0;i<k.length;i+=2){const t=i/(k.length-2);pts.push([S/2+(k[i]-cx)*q,S/2+(k[i+1]-cy)*q,.45+.55*Math.sin(Math.PI*Math.min(1,t*1.15))])}
  const col=th.line||th.red;
  for(let i=0;i<3;i++){const p=pts[Math.floor(R()*pts.length)];blotOn(g,p[0]+(R()-.5)*18,p[1]+(R()-.5)*18,3+R()*5,th.ink,.85,R)}
  brushOn(g,pts,S*.06,{c:col,dry:.45,tin:.08,tout:.3,rnd:R});
  const st=pts[0];blotOn(g,st[0],st[1],S*.018,col,.9,R);
  for(let i=0;i<14;i++){const p=pts[Math.floor(R()*pts.length)],a=R()*6.28,d=6+R()*22;g.fillStyle=R()<.7?col:th.ink;g.globalAlpha=.85;g.beginPath();g.arc(p[0]+Math.cos(a)*d,p[1]+Math.sin(a)*d,.6+R()*2,0,6.283);g.fill()}
  g.globalAlpha=1;
  /* boss pages get a brushed frame, four strokes that overrun at the corners */
  if(boss)[[[2,9],[S-4,7]],[[S-9,2],[S-7,S-4]],[[S-2,S-9],[4,S-7]],[[9,S-2],[7,4]]].forEach(e=>brushOn(g,[e[0],[(e[0][0]+e[1][0])/2+(R()-.5)*3,(e[0][1]+e[1][1])/2+(R()-.5)*3],e[1]],9,{c:th.ink,dry:.4,tin:.06,tout:.18,rnd:R}));
  return tileCache[key]=c.toDataURL('image/webp',.86);
}
function renderMap(){
  cancelTileBake();
  const gen=tileBake.gen;
  kokuTag($('mapK'));
  const L=$('mapL');L.textContent='';
  let nextDone=false;
  const jobs=[];
  CH.forEach((ch,c)=>{
    const th=THEMES[ch.th],sec=document.createElement('section');sec.className='chap';
    const hd=document.createElement('header'),h=document.createElement('h3'),jp=document.createElement('span'),cnt=document.createElement('span');
    jp.className='jp';jp.textContent=th.jp;h.textContent=th.name;cnt.className='cnt';
    let seals=0;ch.lv.forEach((_,l)=>{const r=SV.lv[lid(c,l)];if(r)seals+=r.s.filter(Boolean).length});
    cnt.textContent=seals+'/30';hd.append(h,jp,cnt);
    const gr=document.createElement('div');gr.className='grid';
    ch.lv.forEach((lv,l)=>{
      const b=document.createElement('button'),rec=SV.lv[lid(c,l)],open=isOpen(c,l);
      b.className='tile'+(lv.boss?' boss':'');b.disabled=!open;b.setAttribute('aria-label','Page '+(c*10+l+1)+', '+lv.n+(open?'':', locked'));
      if(open&&!rec&&!nextDone){b.classList.add('next');nextDone=true}
      if(rec&&rec.k&&rec.k.length>3){
        const im=document.createElement('img');im.alt='';
        const key=tileKey(lid(c,l),rec,th);
        b.style.background=th.paper;
        if(tileCache[key]){
          im.src=tileCache[key];
          b.classList.add('painted');b.style.color=th.ink;b.style.background='';
        }else jobs.push({b,im,id:lid(c,l),rec,th,boss:!!lv.boss});
        b.append(im);
      }
      const n=document.createElement('span');n.className='n';n.textContent=String(c*10+l+1);b.append(n);
      const pp=document.createElement('span');pp.className='pips';for(let i=0;i<3;i++){const q=document.createElement('b');if(rec&&rec.s[i])q.className='on';pp.append(q)}b.append(pp);
      b.onclick=()=>{Snd.ui();startLevel(c,l)};gr.append(b);
    });
    sec.append(hd,gr);L.append(sec);
  });
  if(jobs.length)scheduleTileBake(gen,jobs);
}
/* armoury */
let armTab='war',armPick=null;
const CATS={war:{list:WARRIORS,key:'war'},ink:{list:INKS,key:'ink'},fx:{list:FLOURISH,key:'fx'}};
function showArm(){mode='arm';['title','map'].forEach(i=>$(i).hidden=true);$('arm').hidden=false;armPick=null;renderArm()}
function renderArm(){
  kokuTag($('armK'));
  [['tW','war'],['tI','ink'],['tF','fx']].forEach(x=>$(x[0]).classList.toggle('on',armTab===x[1]));
  const box=$('items');box.textContent='';const cat=CATS[armTab];
  cat.list.forEach(it=>{
    const id=it[0],own=SV.own[id],eq=SV.eq[cat.key]===id,b=document.createElement('button');
    b.className='item'+(eq?' eq':'')+(!own&&SV.koku<it[2]?' poor':'');
    const n=document.createElement('b');n.textContent=it[1];const s=document.createElement('span');
    if(armTab==='ink'){const sw=document.createElement('i');sw.className='swatch';sw.style.background=it[3][0];n.prepend(sw)}
    s.textContent=eq?'Equipped':own?'Tap to equip':armPick===id?(SV.koku>=it[2]?'Tap again to buy':'Need '+(it[2]-SV.koku)+' more'):it[2]+' koku';
    b.append(n,s);
    b.onclick=()=>{
      Snd.ui();

      else if(armPick===id&&SV.koku>=it[2]){SV.koku-=it[2];SV.own[id]=1;SV.eq[cat.key]=id;save();armPick=null;Snd.stamp()}
      else armPick=id;

function drawPreview(){
  const c=$('pv'),r=c.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2.5);
  if(!r.width)return;c.width=r.width*d;c.height=r.height*d;
  const g=c.getContext('2d'),th=THEMES[0],pal=palOf(th),cat=CATS[armTab];
  g.setTransform(d,0,0,d,0,0);
  g.fillStyle=th.shade;g.globalAlpha=.5;g.fillRect(0,0,r.width,r.height);g.globalAlpha=1;
  const pick=armPick&&cat.list.find(i=>i[0]===armPick);
  const war=armTab==='war'&&pick?pick[0]:SV.eq.war;
  const ink=(armTab==='ink'&&pick?pick:INK_MAP[SV.eq.ink])[3][0];
  const fx=armTab==='fx'&&pick?pick[0]:SV.eq.fx;
  const R=mulberry(8);
  brushOn(g,[[r.width*.3,r.height*.72,.4],[r.width*.56,r.height*.42,1],[r.width*.78,r.height*.6,1],[r.width-16,r.height*.2,.4]],11,{c:ink,dry:.4,tin:.04,tout:.2,rnd:R});
  for(let i=0;i<14&&fx!=='none';i++){
    const x=r.width*.4+R()*r.width*.55,y=8+R()*(r.height-20);g.save();g.translate(x,y);g.rotate(R()*6);
    if(fx==='petals'){g.fillStyle='#e58aa9';g.beginPath();g.ellipse(0,0,5,3,0,0,6.283);g.fill()}
    else if(fx==='leaves'){g.fillStyle='#c9651e';g.beginPath();g.moveTo(-6,0);g.quadraticCurveTo(0,-5,6,0);g.quadraticCurveTo(0,5,-6,0);g.fill()}
    else if(fx==='snow'){g.fillStyle='#f7f7f2';g.beginPath();g.arc(0,0,3,0,6.283);g.fill()}
    else if(fx==='sparks'){g.fillStyle='#a97c12';g.fillRect(-5,-.8,10,1.6);g.fillRect(-.8,-5,1.6,10)}
    else{g.rotate(-g.getTransform().a?0:0);g.strokeStyle=th.ink;g.lineWidth=2.4;g.beginPath();g.moveTo(-9,-3);g.quadraticCurveTo(0,4,9,-3);g.stroke()}
    g.restore();
  }
  drawSprite(g,samuraiSprite('ready',war,pal),Math.max(96,r.width*.25),r.height-10,.86);
}

cv.addEventListener('pointerdown',e=>{
  Snd.unlock();
  if(mode!=='play'||!P)return;
  e.preventDefault();
  if(P.st==='dead'){if(P.canRetry)retry();return}
  if(P.st!=='plan'||P.wipe||!$('foe').hidden)return;

});

  if(!P||P.st!=='draw'||e.pointerId!==P.pid)return;

});

let rafOn=false;
function frame(ts){
  if(document.hidden){rafOn=false;return}
  requestAnimationFrame(frame);rafOn=true;
  const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;now+=dt;
  if(mode==='play'&&P&&P.room){update(dt);if(P&&P.room&&mode==='play')render()}
  else{drawTitle(dt);if(mode==='title')Snd.music(true)}
}
function armFrame(){if(rafOn||document.hidden)return;rafOn=true;lastTs=0;requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(P&&P.st==='draw')cancelStroke();rafOn=false}
  else{Snd.unlock();armFrame()}
});
async function start(){
  await hydrateSave();
  nativeChrome();
  Snd.set(!!SV.snd);
  setTheme(THEMES[0]);resize();refreshTitle();
  new ResizeObserver(resize).observe(app);
  window.addEventListener('resize',resize);
  if(window.visualViewport)visualViewport.addEventListener('resize',resize);
  if(document.fonts&&document.fonts.load){
    Promise.race([document.fonts.load('400 80px "Hiragino Mincho ProN"','墨斬'),new Promise(r=>setTimeout(r,1800))]).then(()=>{titleArt=null}).catch(()=>{});
  }

}
